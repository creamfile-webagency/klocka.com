name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # schedule:                            # Aktiveras efter Board-godkännande av KLF-4
  #   - cron: '30 4 * * *'              # 05:30 svensk vintertid (04:30 UTC)

jobs:
  build:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          KLOCKRUMMET_FEED_URL: ${{ secrets.KLOCKRUMMET_FEED_URL }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy dist --project-name=klocka-com --branch=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ping Gatus feed heartbeat
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          curl -sf \
            "https://gatus.creamfile.com/api/v1/endpoints/klocka.com_klocka-com-feed/external?success=true" \
            -H "Authorization: Bearer ${{ secrets.GATUS_EXTERNAL_TOKEN }}"
